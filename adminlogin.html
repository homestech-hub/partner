<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homestech Admin | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #059669; --bg: #f8fafc; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: linear-gradient(135deg, #064e3b 0%, #059669 100%);
            height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: white; padding: 40px; border-radius: 24px;
            width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .form-control {
            border: 1px solid #e2e8f0; padding: 12px 15px; border-radius: 12px;
            font-weight: 600; background: #f8fafc;
        }
        .btn-admin {
            background: var(--primary); color: white; font-weight: 800;
            padding: 14px; border-radius: 12px; border: none; width: 100%;
            transition: 0.3s; margin-top: 10px;
        }
        .btn-admin:hover { background: #047857; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="login-card text-center">
        <div class="bg-primary d-inline-block p-3 rounded-4 text-white mb-3">
            <i class="bi bi-shield-lock-fill fs-3"></i>
        </div>
        <h4 class="fw-800 mb-1">Hệ thống Admin</h4>
        <p class="text-muted small mb-4">Vui lòng đăng nhập quyền quản trị</p>

        <form id="loginForm">
            <div class="text-start mb-3">
                <label class="small fw-700 mb-1">EMAIL ADMIN</label>
                <input type="email" id="email" class="form-control" placeholder="admin@homestech.vn" required>
            </div>
            <div class="text-start mb-4">
                <label class="small fw-700 mb-1">MẬT KHẨU</label>
                <input type="password" id="pass" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-admin shadow">ĐĂNG NHẬP HỆ THỐNG</button>
        </form>
        
        <div id="errMsg" class="text-danger small mt-3 fw-600"></div>
    </div>

    <script type="module" src="./js/adminlogin.js"></script>
</body>
</html>
