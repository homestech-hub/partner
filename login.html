<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>Homestech Partner</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#059669" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HT Partner" />

    <!-- ICONS -->
    <link rel="apple-touch-icon"
          sizes="180x180"
          href="https://homestechjsc.vn/wp-content/uploads/2026/05/apple-touch-icon.png" />

    <link rel="icon"
          type="image/png"
          sizes="192x192"
          href="https://homestechjsc.vn/wp-content/uploads/2026/05/icon-192.png" />

    <link rel="icon"
          type="image/png"
          sizes="512x512"
          href="https://homestechjsc.vn/wp-content/uploads/2026/05/icon-512.png" />

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet" />

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
          rel="stylesheet" />
    
    <style>
        :root {
            --primary: #059669;
            --primary-dark: #064e3b;
            --bg-body: #f8fafc;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-body);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        /* Hiệu ứng nền mờ ảo phía sau */
        body::before {
            content: ""; position: absolute; width: 300px; height: 300px;
            background: rgba(5, 150, 105, 0.1); filter: blur(100px);
            top: -50px; right: -50px; z-index: -1;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .card-content {
            background: #ffffff;
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.02);
        }

        .brand-logo {
            width: 60px;
            height: 60px;
            background: rgba(5, 150, 105, 0.1);
            color: var(--primary);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 20px;
        }

        .form-label {
            font-weight: 700;
            color: #475569;
            font-size: 0.85rem;
            margin-bottom: 8px;
            padding-left: 4px;
        }

        .input-custom {
            background: #f1f5f9;
            border: 1px solid transparent;
            border-radius: 16px;
            padding: 14px 18px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .input-custom:focus {
            background: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.08);
        }

        .btn-login {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 0.5px;
            margin-top: 10px;
            box-shadow: 0 10px 20px rgba(5, 150, 105, 0.2);
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(5, 150, 105, 0.3);
        }

        .footer-text {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-top: 30px;
        }

        .register-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="card-content">
            <div class="text-center">
                <div class="brand-logo">
                    <i class="bi bi-cpu-fill"></i>
                </div>
                <h4 class="fw-800 text-dark mb-1">Partner Hub</h4>
                <p class="text-muted small mb-4">Chào mừng bạn quay lại với Homestech</p>
            </div>

            <div class="mb-3">
                <label class="form-label">TÀI KHOẢN EMAIL</label>
                <input id="email" type="email" class="form-control input-custom" placeholder="partner@homestech.com">
            </div>

            <div class="mb-4">
                <label class="form-label">MẬT KHẨU</label>
                <input id="pass" type="password" class="form-control input-custom" placeholder="••••••••">
            </div>

            <button onclick="login()" class="btn btn-login w-100">
                ĐĂNG NHẬP NGAY
            </button>

            <div class="footer-text text-center">
                Chưa có tài khoản đối tác? <br>
                <a href="register.html" class="register-link">Gửi yêu cầu hợp tác</a>
            </div>
        </div>
    </div>

    <script type="module" src="./js/auth.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker đã đăng ký thành công!', reg.scope))
            .catch(err => console.log('Đăng ký Service Worker thất bại!', err));
        });
      }
    </script>
</body>
</html>
