<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover">

<title>Homestech Partner</title>

<!-- PWA -->
<link rel="manifest" href="/manifest.json">

<meta name="theme-color" content="#059669">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HT Partner">

<link
    rel="apple-touch-icon"
    sizes="180x180"
    href="https://homestechjsc.vn/wp-content/uploads/2026/05/partner.png">

<!-- Bootstrap -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
    rel="stylesheet">

<style>

:root{
    --primary:#059669;
    --primary-dark:#064e3b;
    --bg-body:#f8fafc;
}

/* RESET */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    width:100%;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
}

body{
    width:100%;
    height:100dvh;
    overflow:hidden;
    position:fixed;
    inset:0;

    font-family:'Plus Jakarta Sans',sans-serif;
    background:var(--bg-body);

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    overscroll-behavior:none;
    -webkit-overflow-scrolling:none;
}

/* Glow */

body::before{
    content:"";
    position:absolute;
    width:320px;
    height:320px;
    background:rgba(5,150,105,.10);
    filter:blur(100px);
    top:-100px;
    right:-100px;
    z-index:-1;
}

/* CARD */

.login-card{
    width:100%;
    max-width:420px;
    position:relative;
    z-index:2;
}

.card-content{
    width:100%;

    background:#fff;

    border-radius:32px;

    padding:40px 28px;

    box-shadow:
        0 20px 40px rgba(0,0,0,.04);

    border:
        1px solid rgba(0,0,0,.03);
}

/* LOGO */

.brand-logo{
    width:68px;
    height:68px;

    background:rgba(5,150,105,.1);

    color:var(--primary);

    border-radius:20px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:30px;

    margin:0 auto 20px;
}

/* TEXT */

h4{
    font-weight:800;
}

.form-label{
    font-size:.82rem;
    font-weight:700;
    color:#475569;

    margin-bottom:8px;
    padding-left:4px;
}

/* INPUT */

.input-custom{
    height:56px;

    background:#f1f5f9;

    border:none;

    border-radius:16px;

    padding:0 18px;

    font-size:16px; /* chống zoom iPhone */

    transition:.25s;
}

.input-custom:focus{
    background:#fff;

    border:1px solid var(--primary);

    box-shadow:
        0 0 0 4px rgba(5,150,105,.08);
}

/* BUTTON */

.btn-login{
    width:100%;
    height:56px;

    border:none;

    border-radius:16px;

    background:var(--primary);
    color:#fff;

    font-weight:800;
    font-size:1rem;

    margin-top:8px;

    transition:.25s;

    box-shadow:
        0 10px 20px rgba(5,150,105,.2);
}

.btn-login:hover{
    background:var(--primary-dark);
}

.btn-login:active{
    transform:scale(.98);
}

/* FOOTER */

.footer-text{
    margin-top:28px;

    text-align:center;

    color:#94a3b8;
    font-size:.85rem;
}

.register-link{
    color:var(--primary);
    text-decoration:none;
    font-weight:700;
}

/* MOBILE */

@media(max-width:480px){

    body{
        padding:16px;
    }

    .card-content{
        padding:32px 22px;
        border-radius:28px;
    }

    .brand-logo{
        width:60px;
        height:60px;
        font-size:26px;
    }
}

</style>
</head>

<body>

<div class="login-card">

    <div class="card-content">

        <div class="text-center">

            <div class="brand-logo">
                <i class="bi bi-cpu-fill"></i>
            </div>

            <h4 class="text-dark mb-1">
                Partner Hub
            </h4>

            <p class="text-muted small mb-4">
                Chào mừng bạn quay lại với Homestech
            </p>

        </div>

        <!-- EMAIL -->

        <div class="mb-3">

            <label class="form-label">
                TÀI KHOẢN EMAIL
            </label>

            <input
                id="email"
                type="email"
                class="form-control input-custom"
                placeholder="partner@homestech.com">

        </div>

        <!-- PASSWORD -->

        <div class="mb-4">

            <label class="form-label">
                MẬT KHẨU
            </label>

            <input
                id="pass"
                type="password"
                class="form-control input-custom"
                placeholder="••••••••">

        </div>

        <!-- BUTTON -->

        <button onclick="login()" class="btn-login">
            ĐĂNG NHẬP NGAY
        </button>

        <!-- FOOTER -->

        <div class="footer-text">

            Chưa có tài khoản đối tác?
            <br>

            <a href="register.html" class="register-link">
                Gửi yêu cầu hợp tác
            </a>

        </div>

    </div>

</div>

<!-- AUTH -->
<script type="module" src="./js/auth.js"></script>

<!-- SERVICE WORKER -->
<script>

if ('serviceWorker' in navigator) {

    window.addEventListener('load', async () => {

        try {

            const reg =
                await navigator.serviceWorker.register('/sw.js');

            console.log('SW OK:', reg.scope);

        } catch (err) {

            console.log('SW FAIL:', err);

        }

    });

}

</script>

</body>
</html>
